name: Release for Windows

# Установщик .exe собирается на Windows и публикуется в GitHub Releases,
# когда в репозиторий пушится тег вида finance-tracker-v1.2.3.
# Ручной запуск (Actions → Release for Windows → Run workflow) собирает установщик без релиза.
on:
  push:
    tags: ['finance-tracker-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Установщик для Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Сборка приложения для десктопа
        run: npm run build
        env:
          DESKTOP: '1'
      - name: Установщик .exe
        run: npx electron-builder --win nsis --publish never
      - name: Файл установщика в артефакты запуска
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error
      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Финансы ${{ github.ref_name }}
          files: release/*.exe
          body: |
            ## Финансы для Windows

            1. Скачайте `.exe` ниже и запустите.
            2. Если Windows покажет «Система Windows защитила ваш компьютер» — нажмите **Подробнее → Выполнить в любом случае**. Установщик не подписан платным сертификатом, поэтому SmartScreen его не знает.
            3. Выберите папку — ярлык появится на рабочем столе и в меню «Пуск».
